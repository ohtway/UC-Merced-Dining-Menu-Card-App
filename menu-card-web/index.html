<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Menu Card Maker — VW/VH Scaling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preload" href="assets/fonts/Kievit Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/Minion Pro Italic.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <!-- Uniform scaling handled by viewBox + preserveAspectRatio -->
    <svg id="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="previewGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#000000"/>
          <stop offset="50%"  stop-color="#0f2b4b"/>
          <stop offset="100%" stop-color="#000000"/>
        </linearGradient>
        <style>
          .kievit { font-family: Kievit, sans-serif; }
          .minion { font-family: "Minion Italic", serif; font-style: italic; }
        </style>
      </defs>

      <!-- Right gray panel -->
      <rect x="1077.8" y="0" width="842.2" height="1080" fill="#e5e5e5" />

      <!-- Titles -->
      <text class="kievit" x="47.3"  y="38.6"  font-size="42">Menu Card Maker</text>
      <text class="minion" x="47.3"  y="96.9"  font-size="20" fill="#222">Version 1.0.5</text>

      <!-- Item name -->
      <text class="kievit" x="54.7"  y="198.2" font-size="18">Item Name:</text>
      <!-- Outline for the input -->
      <rect id="itemOutline" x="165" y="193.8" width="766.4" height="31.8" fill="#fff" stroke="#9f9f9f" stroke-width="2" rx="6"/>

      <!-- foreignObject input (scales with SVG) -->
      <foreignObject x="171" y="197.8" width="754.4" height="23.8">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;">
          <input id="itemInput" type="text" placeholder="Type item name..." />
        </div>
      </foreignObject>

      <!-- Section headers -->
      <text class="kievit" x="54.7" y="295.4" font-size="18">Allergens:</text>
      <text class="kievit" x="505"  y="295.4" font-size="18">Attributes:</text>
      <text class="kievit" x="502"  y="472.6" font-size="18">Artificial Colors:</text>
      <text class="kievit" x="716"  y="472.6" font-size="18">Texture &amp; Stabilizers:</text>

      <!-- Icon groups populated by JS (base coords; will scale by viewBox) -->
      <g id="allergenCircles"></g>
      <g id="attributeCircles"></g>
      <g id="artColorPills"></g>
      <g id="texturePills"></g>

      <!-- Logo -->
      <image id="logoImg" href="assets/icons/dining_logo.png" x="37.7" y="921.7" width="156.6" height="156.6"/>

      <!-- Bottom buttons (labels via JS for brevity) -->
      <g id="bottomButtons"></g>

      <!-- Preview area -->
      <g id="previewPanel"></g>
    </svg>
  </div>

  <script src="app.js"></script>
</body>
</html>
